# TerraAsia —— 静态站点（Vite 产物）
# 安装位置：/etc/nginx/conf.d/terra-asia.conf
# 站点端口：8159（80 不对外，由 setup-server.sh 的第二个参数覆盖）
# 目录结构（由 CI 维护）：
#   /var/www/terra-asia/current            -> 指向 releases/ 下某个版本的软链（原子切换）
#   /var/www/terra-asia/releases/<n>-<sha>/  index.html + assets/（带 hash）+ data/
#   历史版本保留最近 5 个，回滚 = 把 current 指回旧目录
server {
    listen 8159;
    listen [::]:8159;
    server_name _;

    # 注意：root 指向 current 软链，不要指向 releases/ 里的某个具体版本
    root /var/www/terra-asia/current;
    index index.html;
    charset utf-8;

    # 首屏 HTML 只有 1KB 上下，但地形 PNG 约 2.5MB、data.json 约 0.8MB；
    # gzip 对 JS/CSS/JSON 收益很大（three.js 651KB → 约 172KB），PNG 不再压。
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/terra-asia.access.log;
    error_log  /var/log/nginx/terra-asia.error.log warn;

    # 入口不缓存：发布后立刻生效（切换本身是软链原子替换）
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 文件名带内容 hash，可以放心长缓存（一年 + immutable）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 数据文件名固定（terrain.png / data.json / world.png），必须回源校验，
    # 否则换了数据用户还看旧图 —— 用 ETag + 一小时缓存折中。
    location /data/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
